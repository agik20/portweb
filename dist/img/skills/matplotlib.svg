<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
  <title>matplotlib - minimalist icon (black)</title>
  <rect x="8" y="8" width="112" height="112" rx="12" ry="12" fill="none" stroke="#000" stroke-width="6"/>
  <!-- axes -->
  <line x1="24" y1="104" x2="24" y2="28" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <line x1="24" y1="104" x2="100" y2="104" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <!-- tick marks -->
  <line x1="24" y1="86" x2="30" y2="86" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="68" x2="30" y2="68" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="50" x2="30" y2="50" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="104" x2="42" y2="98" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="104" x2="60" y2="98" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="104" x2="78" y2="98" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="104" x2="96" y2="98" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- line plot -->
  <path d="M24 88 C 36 70, 46 56, 60 60 S 88 92, 100 44" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
